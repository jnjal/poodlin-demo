name: Deploy GitHub Pages

on:
  push:
    branches: [gh-pages, main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # سایت استاتیک از branch gh-pages می‌آید — بیلدی در کار نیست.
      - name: Checkout site files
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Keep workflow files out of the published site
        run: rm -rf .github

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
